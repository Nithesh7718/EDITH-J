# =========================================================
# EDITH-J Local Override Configuration
# Non-secret settings only.
#
# Purpose:
# - Override safe local settings for development or personal use
# - Keep secrets such as API keys in environment variables
#
# Config precedence (highest first):
# 1. Environment variables
# 2. This edith.properties file
# 3. Hardcoded defaults
#
# Example env mappings:
# edith.ai.provider -> EDITH_AI_PROVIDER
# groq.api-key -> GROQ_API_KEY
# speech.vosk.model-path -> SPEECH_VOSK_MODEL_PATH
# =========================================================


# =========================================================
# Application
# =========================================================
app.name=EDITH-J
# Not currently read by the app:
# edith.app.env=local
# edith.app.port=8080
# edith.app.autoOpenBrowser=true


# =========================================================
# Workspace
# Used for assistant operations and file-search scoping.
# Set this to your preferred working directory.
# Example:
# edith.ai.workspaceDir=C:/Users/your-user/Documents/EDITH
# =========================================================
edith.ai.workspaceDir=C:/Users/your-user/Documents/EDITH


# =========================================================
# AI
# Choose the preferred provider locally.
# Supported by README: groq, gemini, openai, sarvam
# =========================================================
edith.ai.provider=groq
# Not currently read by the app:
# edith.ai.fallbackProvider=gemini
# edith.ai.enableFallback=true


# =========================================================
# Optional provider model overrides
# Uncomment only if needed.
# =========================================================
# groq.model=llama-3.3-70b-versatile
# groq.base-url=https://api.groq.com/openai/v1
# edith.ai.gemini.model=gemini-2.0-flash
# edith.ai.openai.model=gpt-4o-mini
# edith.ai.sarvam.model=sarvam-m


# =========================================================
# Storage
# SQLite is the documented persistence backend.
# =========================================================
storage.backend=sqlite
storage.db-path=C:/Users/your-user/.edith-j/data/edith.db


# =========================================================
# Voice / Speech
# Vosk model path is documented in the README.
# You can also lock EDITH to a preferred microphone.
# =========================================================
# Not currently read by the app:
# speech.enabled=true
speech.vosk.model-path=models/vosk-model-small-en-us-0.15
speech.audio.input-device-name=Microphone Array (AMD Audio Device)


# =========================================================
# Desktop Automation
# Keep risky features explicit.
# =========================================================
edith.desktop.fileOpenEnabled=true
edith.desktop.clipboardWriteEnabled=true
# Not currently read by the app:
# edith.desktop.webSearchEnabled=true
# edith.desktop.openAppEnabled=true


# =========================================================
# Automation Defaults
# =========================================================
edith.automation.musicUrl=https://music.youtube.com


# =========================================================
# WhatsApp Contact Aliases
# Map a friendly contact name to a full phone number.
# Example:
# edith.whatsapp.contact.krithick=+919876543210
# =========================================================
# edith.whatsapp.contact.krithick=+919876543210


# =========================================================
# World Monitor
# Keep API key in env var: WORLD_MONITOR_API_KEY
# =========================================================
# worldmonitor.base-url=https://www.worldmonitor.app


# =========================================================
# Local File Search
# Used by future/extended EDITH file search features.
# allowedDirs values:
# - workspace
# - documents
# - downloads
# - desktop
# =========================================================
edith.search.maxResults=10
edith.search.allowedDirs=workspace,documents,downloads,desktop
edith.search.excludeExtensions=.tmp,.log


# =========================================================
# Launcher Overrides
# Alias = absolute executable path
# Uncomment and customize as needed.
# =========================================================
# edith.launch.notepad=C:/Windows/System32/notepad.exe
# edith.launch.calc=C:/Windows/System32/calc.exe
# edith.launch.chrome=C:/Program Files/Google/Chrome/Application/chrome.exe


# =========================================================
# UI / Dev
# Uncomment if you want EDITH to target a frontend dev server.
# =========================================================
# edith.ui.useDevServer=false
# edith.ui.devServerUrl=http://localhost:5173
